name: Bug Report
description: Report a reproducible bug or regression in LiveUX FileManagerBundle
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!
        If you found a **security vulnerability** (XSS, Path Traversal, SSRF, CSRF, etc.), please do **not** open a public issue — see `SECURITY.md`.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, configuration snippet, or code to reproduce the issue.
      placeholder: |
        1. Configure `liveux_file_manager.yaml` with ...
        2. Open the file manager in modal/inline mode
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Run `php bin/console file-manager:doctor` and paste the output (remove any private paths/secrets).
      placeholder: |
        - Bundle version: 0.1.0
        - PHP version: 8.4.x
        - Symfony version: 8.0.x
        - Asset pipeline: AssetMapper / Webpack Encore
        - Storage driver: LocalFileSystem / AwsS3
        - Theme: bootstrap5 / tailwind / shadcn / ...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Console logs
      description: Optional screenshots or browser DevTools / Symfony Profiler error logs.
    validations:
      required: false
